services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: seokav
      POSTGRES_USER: seokav
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "5432:5432"
    volumes:
      - seokav-postgres:/var/lib/postgresql/data

volumes:
  seokav-postgres:
