function visibleSet(){if(!query)return null;const q=query.toLowerCase(),map=new Map(items.map(x=>[x.id,x])),set=new Set;items.forEach(x=>{if(!(x.name+' '+x.slug).toLowerCase().includes(q))return;set.add(x.id);let p=map.get(x.parent);while(p&&!set.has(p.id)){set.add(p.id);p=map.get(p.parent)}});return set}
function nodeHtml(n,d,visible){if(visible&&!visible.has(n.id))return '';const kids=n.children.filter(x=>!visible||visible.has(x.id)),open=query||expanded.has(n.id),hit=query&&(n.name+' '+n.slug).toLowerCase().includes(query.toLowerCase());return '<li><div class="row '+(hit?'match':'')+'" style="--depth:'+d+'"><button class="toggle" data-toggle="'+n.id+'">'+(kids.length?(open?'⌄':'›'):'·')+'</button><span class="folder l'+Math.min(d,3)+'">'+(kids.length&&open?'▾':'◆')+'</span><button class="node" data-toggle="'+(kids.length?n.id:'')+'"><b>'+esc(n.name)+'</b><code>'+esc(n.slug||'—')+'</code></button><span class="count '+(n.count===0?'zero':'')+'">'+fa(n.count)+' محصول</span>'+(n.url?'<a class="link" target="_blank" href="'+esc(n.url)+'">↗</a>':'')+'</div>'+(kids.length&&open?'<ul>'+kids.map(x=>nodeHtml(x,d+1,visible)).join('')+'</ul>':'')+'</li>'}
function render(){const roots=makeTree(),visible=visibleSet(),empty=items.filter(x=>x.count===0);$('total').textContent=fa(items.length);$('roots').textContent=fa(roots.length);$('depth').textContent=fa(items.length?maxDepth(roots):0);$('empty').textContent=fa(empty.length);$('dataset').textContent=$('title').textContent=dataset;$('result').textContent=visible?fa(visible.size)+' نتیجه و مسیر':fa(items.length)+' دسته';$('tree').innerHTML=roots.map(x=>nodeHtml(x,0,visible)).join('');$('noResults').classList.toggle('hidden',!visible||visible.size>0);$('emptyList').innerHTML=empty.map(x=>'<button data-find="'+esc(x.name)+'"><span>'+esc(x.name)+'</span><code>'+esc(x.slug)+'</code></button>').join('');document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.toggle);if(!id)return;expanded.has(id)?expanded.delete(id):expanded.add(id);render()});document.querySelectorAll('[data-find]').forEach(b=>b.onclick=()=>{$('search').value=b.dataset.find;query=b.dataset.find;render()})}
function normalize(data){const src=Array.isArray(data)?data:Array.isArray(data?.categories)?data.categories:[];return [...new Map(src.map((x,i)=>({id:Number(x.id??x.term_id??i+1),parent:Number(x.parent??x.parent_id??0),name:String(x.name??x.title??'').trim(),slug:String(x.slug??'').trim(),count:Number(x.count??x.product_count??0),url:String(x.url??x.link??'').trim()})).filter(x=>x.id>0&&x.name).map(x=>[x.id,x])).values()]}
function cells(line){let out=[],v='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&q&&line[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){out.push(v.trim());v=''}else v+=c}out.push(v.trim());return out}
function parseCsv(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),heads=cells(lines[0]).map(x=>x.toLowerCase());return normalize(lines.slice(1).map(l=>Object.fromEntries(heads.map((h,i)=>[h,cells(l)[i]??'']))))}
function download(name,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const text=await f.text(),parsed=f.name.toLowerCase().endsWith('.csv')?parseCsv(text):normalize(JSON.parse(text));if(!parsed.length)throw 0;items=parsed;dataset=f.name.replace(/.(json|csv)$/i,'');expanded=new Set(items.map(x=>x.id));query='';$('search').value='';$('status').textContent=fa(items.length)+' دسته با موفقیت وارد شد.';render()}catch{$('status').textContent='فایل قابل خواندن نیست؛ فرمت ستون‌ها را بررسی کنید.'}e.target.value=''};
$('search').oninput=e=>{query=e.target.value.trim();render()};$('openAll').onclick=()=>{expanded=new Set(items.map(x=>x.id));render()};$('closeAll').onclick=()=>{expanded=new Set;render()};
$('json').onclick=()=>download('wordpress-categories.json',JSON.stringify({categories:items},null,2),'application/json;charset=utf-8');
$('csv').onclick=()=>{const q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=['id,parent,name,slug,count,url',...items.map(x=>[x.id,x.parent,x.name,x.slug,x.count,x.url].map(q).join(','))];download('wordpress-categories.csv','\uFEFF'+rows.join('\n'),'text/csv;charset=utf-8')};
$('svg').onclick=()=>{let rows=[];const walk=(ns,d)=>ns.forEach(n=>{rows.push({name:n.name,depth:d,count:n.count});walk(n.children,d+1)});walk(makeTree(),0);const h=Math.max(180,rows.length*34+100),lines=rows.map((r,i)=>{const y=80+i*34;return '<text x="'+(1110-r.depth*30)+'" y="'+y+'" text-anchor="end" direction="rtl" font-family="Tahoma" font-size="16" fill="#17212b">'+esc(r.name)+'</text><text x="80" y="'+y+'" font-family="Tahoma" font-size="13" fill="#667785">'+fa(r.count)+' محصول</text>'}).join(''),svg='<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="'+h+'"><rect width="100%" height="100%" rx="24" fill="#f6f8f7"/><text x="1140" y="42" text-anchor="end" direction="rtl" font-family="Tahoma" font-size="24" fill="#17212b">درخت دسته‌بندی '+esc(dataset)+'</text>'+lines+'</svg>';download('category-tree.svg',svg,'image/svg+xml;charset=utf-8')};$('print').onclick=()=>print();render();
</script>
