name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application and release artifacts
        run: npm run check
      - name: Validate WordPress connector syntax
        run: php -l wordpress-plugin/seokav-wordpress-connector/seokav-connector.php
      - name: Verify connector archive matches tracked source
        shell: bash
        run: |
          cmp wordpress-plugin/seokav-wordpress-connector/seokav-connector.php \
            <(unzip -p seokav-connector.zip seokav-wordpress-connector/seokav-connector.php)
          cmp wordpress-plugin/seokav-wordpress-connector/readme.txt \
            <(unzip -p seokav-connector.zip seokav-wordpress-connector/readme.txt)
