name: Bug report
description: Report a reproducible problem in Seokav or the WordPress connector.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include connector keys, credentials, or private client data."
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Browser application
        - Taxonomy graph
        - Product or category editor
        - Task calendar or report
        - WordPress connector
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "Application 1.2.0 / Connector 1.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, WordPress, WooCommerce, PHP, and theme.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove secrets and private site data first.
